name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300FF4C&color_dots=%2305100A,%23001A0D,%23003D20,%2300A83B,%2300FF4C
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300FFD5&color_dots=%2305100A,%23001A0D,%23003D20,%2300A83B,%2300FF4C

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
